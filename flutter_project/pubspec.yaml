name: padel_scorebot
description: "Tabellone segnapunti Padel 100% offline stile ScoreBot con supporto telecomando Bluetooth, TTS in italiano e Wakelock."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.2
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  wakelock_plus: ^1.2.8
  volume_controller: ^2.0.8
  # 11.x evita i nuovi requisiti AGP/Kotlin introdotti dalla 12.x.
  share_plus: ">=11.1.0 <12.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
