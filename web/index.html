<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tabellone segnapunti Padel stile ScoreBot con supporto telecomando Bluetooth, MediaSession API e sintesi vocale.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Padel ScoreBot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Padel ScoreBot</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #070B14; margin: 0; overflow: hidden;">

  <!-- Audio in background completamente silenzioso in loop per sbloccare la MediaSession API su iOS/Safari e Android/Chrome -->
  <audio
    id="padel-silent-audio"
    preload="auto"
    loop
    playsinline
    webkit-playsinline
    src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YRAAAAAAAAAAAAAAAAAAAAAA"
  ></audio>

  <script>
    (function() {
      // 1. SBLOCCO AUDIO BROWSER E MEDIASESSION API (Mobile Web iOS/Safari & Android/Chrome)
      var isAudioUnlocked = false;
      var silentAudio = document.getElementById('padel-silent-audio');

      function unlockMediaSession() {
        if (isAudioUnlocked) return;

        if (silentAudio) {
          silentAudio.volume = 0.01;
          var playPromise = silentAudio.play();
          if (playPromise !== undefined) {
            playPromise.then(function() {
              isAudioUnlocked = true;
              initMediaSession();
              console.log('[Padel Web Remote] Traccia silenziosa attiva e MediaSession sbloccata con successo.');
            }).catch(function(err) {
              console.warn('[Padel Web Remote] Autoplay in attesa di interazione:', err);
            });
          }
        }
      }

      function initMediaSession() {
        if (!('mediaSession' in navigator)) return;

        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'Padel ScoreBot',
            artist: 'Telecomando Bluetooth Attivo',
            album: 'Segnapunti Padel'
          });

          function dispatchRemoteSignal(action) {
            // Invia CustomEvent per il bridge Dart/Flutter
            window.dispatchEvent(new CustomEvent('padel-remote-signal', { detail: { action: action } }));

            // Chiama callback diretta se registrata da Flutter
            if (typeof window.__onPadelRemoteSignal === 'function') {
              window.__onPadelRemoteSignal(action);
            }
          }

          var actions = ['play', 'pause', 'nexttrack', 'previoustrack', 'stop', 'seekbackward', 'seekforward'];
          actions.forEach(function(act) {
            try {
              navigator.mediaSession.setActionHandler(act, function() {
                // I telecomandi selfie inviano play, pause o nexttrack
                dispatchRemoteSignal(act);
              });
            } catch (e) {}
          });
        } catch (e) {
          console.warn('[Padel Web Remote] Errore configurazione MediaSession:', e);
        }
      }

      // Sblocco al primo tocco o clic dell'utente
      window.addEventListener('click', unlockMediaSession, { passive: true });
      window.addEventListener('touchstart', unlockMediaSession, { passive: true });
      window.addEventListener('pointerdown', unlockMediaSession, { passive: true });
      window.addEventListener('keydown', unlockMediaSession, { passive: true });

      // 2. CAPTURE EVENTI TASTIERA GLOBALE (HID / Presenter / Telecomando)
      var holdTimer = null;
      var isHold = false;

      window.addEventListener('keydown', function(e) {
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        var k = e.key;

        // Undo immediato per Escape, Backspace e Volume Down
        if (k === 'Escape' || k === 'Backspace' || k === 'AudioVolumeDown' || k === 'VolumeDown') {
          if (typeof window.__onPadelRemoteSignal === 'function') {
            window.__onPadelRemoteSignal('undo');
          }
          return;
        }

        var isImpulse =
          k === 'AudioVolumeUp' || k === 'VolumeUp' || k === 'ArrowUp' || k === 'ArrowDown' ||
          k === ' ' || k === 'Enter' || k === 'MediaTrackNext' || k === 'MediaTrackPrevious';

        if (isImpulse) {
          if (!holdTimer && !isHold) {
            holdTimer = setTimeout(function() {
              isHold = true;
              if (typeof window.__onPadelRemoteSignal === 'function') {
                window.__onPadelRemoteSignal('hold');
              }
            }, 600);
          }
        }
      }, { capture: true });

      window.addEventListener('keyup', function(e) {
        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }

        if (isHold) {
          isHold = false;
          return;
        }

        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        var k = e.key;
        var isImpulse =
          k === 'AudioVolumeUp' || k === 'VolumeUp' || k === 'ArrowUp' || k === 'ArrowDown' ||
          k === ' ' || k === 'Enter' || k === 'MediaTrackNext' || k === 'MediaTrackPrevious';

        if (isImpulse) {
          if (typeof window.__onPadelRemoteSignal === 'function') {
            window.__onPadelRemoteSignal('click');
          }
        }
      }, { capture: true });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
