name: padel_scorebot
description: "Tabellone segnapunti Padel 100% offline stile ScoreBot con supporto telecomando Bluetooth, TTS in italiano e Wakelock."
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.2
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  wakelock_plus: ^1.2.8
  volume_controller: ^2.0.8
  # Monitoraggio opzionale del volume su iOS (nessun bridge personalizzato).
  perfect_volume_control: ^1.0.6
  # Sonda iOS DEBUG isolata: NON usare nel segnapunti di produzione.
  padel_volume_diagnostic:
    path: packages/padel_volume_diagnostic
  # 11.x evita i nuovi requisiti AGP/Kotlin introdotti dalla 12.x.
  share_plus: ">=11.1.0 <12.0.0"
  package_info_plus: 9.0.1
  url_launcher: 6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon.png"
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

# Patch Android locale: sorgenti iOS/Dart originali conservati.
dependency_overrides:
  volume_controller:
    path: packages/volume_controller
  perfect_volume_control:
    path: packages/perfect_volume_control
